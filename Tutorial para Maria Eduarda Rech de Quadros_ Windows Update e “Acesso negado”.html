<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutorial para Maria Eduarda Rech de Quadros: Windows Update e “Acesso negado”</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#5b6679;--ac:#2563eb;--ok:#16a34a;--bd:#d9dfeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192031;--tx:#e8ecf5;--mut:#9aa5ba;--ac:#6b9bff;--ok:#4ade80;--bd:#2c3650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192031;--tx:#e8ecf5;--mut:#9aa5ba;--ac:#6b9bff;--ok:#4ade80;--bd:#2c3650;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px;padding:16px}
h1{font-size:1rem;color:var(--mut);margin:4px 0 12px;font-weight:600}
.stage{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;min-height:440px;display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;background:var(--ac);color:#fff;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700}
.stage h2{margin:0;font-size:1.5rem}
.stage p{margin:0;font-size:1.05rem;line-height:1.5}
.vis{flex:1;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.win{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;background:var(--bg);width:100%;max-width:520px;font-size:.95rem;animation:in .5s}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px dashed var(--ac);border-radius:8px;padding:10px 12px;word-break:break-all;display:block;margin-top:6px}
.key{display:inline-block;border:1px solid var(--bd);border-bottom-width:3px;border-radius:6px;padding:4px 10px;background:var(--card);font-weight:700}
.hl{outline:3px solid var(--ac);border-radius:6px;padding:2px 8px;animation:pulse 1.2s infinite}
.row{padding:6px 8px;border-radius:6px}
.big{font-size:2.2rem;font-weight:800;text-align:center}
.arrow{color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{outline-color:transparent}}
.bar{height:6px;background:var(--bd);border-radius:99px;margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
<h1>🎬 Aula especial para Maria Eduarda Rech de Quadros</h1>
<div class="stage" id="st"></div>
<div class="bar"><i id="pg"></i></div>
<div class="ctl">
<button id="pv">⏮ Voltar</button>
<button id="pl" class="p">⏸ Pausar</button>
<button id="nx">Avançar ⏭</button>
<button id="nr">🔊 Narração: desligada</button>
</div>
</div>
<script>
var S=[
{t:"Olá, Maria Eduarda Rech de Quadros! 👋",x:"Hoje vou te ensinar, passo a passo, a corrigir o erro “Acesso negado” do Windows Update. É só seguir com calma, no seu ritmo.",v:'<div class="win big">🪟 Windows Update<br><span style="font-size:1rem;color:var(--mut)">vamos ligar o serviço de volta</span></div>',n:"Olá, Maria Eduarda Rech de Quadros! Hoje vou te ensinar, passo a passo, a corrigir o erro de acesso negado do Windows Update. É só seguir com calma, no seu ritmo."},
{t:"Passo 1: abrir o Regedit",x:"Aperte as teclas Windows + R juntas. Digite regedit e aperte Enter. Se aparecer uma pergunta, clique em Sim.",v:'<div class="win"><span class="key">Windows</span> + <span class="key">R</span><span class="code">regedit</span><div style="margin-top:8px">Depois: <span class="key">Enter</span> → clique em <span class="hl">Sim</span></div></div>',n:"Passo 1. Aperte as teclas Windows mais R juntas. Digite regedit e aperte Enter. Se aparecer uma pergunta, clique em Sim."},
{t:"Passo 2: ir até o endereço certo",x:"Na barra de endereço, no alto da janela, cole o caminho abaixo e aperte Enter.",v:'<div class="win">Barra de endereço:<span class="code hl">HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\wuauserv</span></div>',n:"Passo 2. Na barra de endereço, no alto da janela, cole o caminho que está na tela e aperte Enter."},
{t:"Passo 3: abrir as Permissões",x:"Na coluna da esquerda, clique com o botão direito na pasta wuauserv e escolha “Permissões…”.",v:'<div class="win"><div class="row">📁 ...</div><div class="row hl">📁 wuauserv &nbsp; <small>(botão direito)</small></div><div class="row">➡ <b>Permissões…</b></div></div>',n:"Passo 3. Na coluna da esquerda, clique com o botão direito na pasta wuauserv e escolha Permissões."},
{t:"Passo 4: botão Avançadas",x:"Na janela que abriu, clique no botão Avançadas, perto da parte de baixo.",v:'<div class="win">Permissões de wuauserv<br><br><div style="text-align:right"><span class="hl">Avançadas</span></div></div>',n:"Passo 4. Na janela que abriu, clique no botão Avançadas, perto da parte de baixo."},
{t:"Passo 5: alterar o proprietário",x:"Lá em cima, onde está escrito “Proprietário:”, clique em Alterar.",v:'<div class="win">Proprietário: <b>SYSTEM</b> &nbsp; <span class="hl">Alterar</span></div>',n:"Passo 5. Lá em cima, onde está escrito Proprietário, clique em Alterar."},
{t:"Passo 6: digitar o nome",x:"No campo em branco, digite Administradores. Se o seu Windows estiver em inglês, digite Administrators. Clique em “Verificar nomes” (o nome fica sublinhado) e depois em OK.",v:'<div class="win">Digite o nome do objeto:<span class="code hl">Administradores</span><div style="margin-top:8px"><span class="key">Verificar nomes</span> → <u>Administradores</u> → <span class="key">OK</span></div></div>',n:"Passo 6. No campo em branco, digite Administradores. Se o seu Windows estiver em inglês, digite Administrators. Clique em Verificar nomes e depois em OK."},
{t:"Passo 7: marcar a caixinha",x:"Marque “Substituir o proprietário em subcontêineres e objetos” e clique em Aplicar.",v:'<div class="win"><div class="hl">☑ Substituir o proprietário em subcontêineres e objetos</div><div style="margin-top:10px"><span class="key">Aplicar</span></div></div>',n:"Passo 7. Marque a caixinha Substituir o proprietário em subcontêineres e objetos e clique em Aplicar."},
{t:"Passo 8: Controle Total",x:"Na lista de permissões, clique no grupo Administradores. Marque Permitir na linha de Controle Total e clique em OK.",v:'<div class="win"><div class="row">Usuários</div><div class="row hl">Administradores</div><div style="margin-top:8px">Controle Total &nbsp; <b>☑ Permitir</b></div></div>',n:"Passo 8. Na lista de permissões, clique no grupo Administradores. Marque Permitir na linha de Controle Total e clique em OK."},
{t:"Passo 9: trocar o valor de Start",x:"No lado direito, dê dois cliques no item Start. Troque o valor de 4 para 2 e clique em OK.",v:'<div class="win"><div class="big"><span style="color:#dc2626">4</span> <span class="arrow">→</span> <span style="color:var(--ok)">2</span></div><div style="text-align:center">Dados: <b>0x00000002 (2)</b> ✔ sem caixa de erro</div></div>',n:"Passo 9. No lado direito, dê dois cliques no item Start. Troque o valor de 4 para 2 e clique em OK. Se ao lado de Start aparecer 0x00000002, entre parênteses 2, deu certo."},
{t:"Último passo: reiniciar 🎉",x:"Feche o Regedit e reinicie o computador. Pronto, Maria Eduarda! O Windows Update vai iniciar sozinho junto com o Windows.",v:'<div class="win big">✅ Pronto, Maria Eduarda!<br><span style="font-size:1rem;color:var(--mut)">Reinicie o PC e está feito</span></div>',n:"Último passo. Feche o Regedit e reinicie o computador. Pronto, Maria Eduarda! O Windows Update vai iniciar sozinho junto com o Windows."}
];
var i=0,play=true,voice=false,tm=null;
var st=document.getElementById("st");
function show(){
 var s=S[i];
 st.innerHTML='<span class="badge">'+(i+1)+' de '+S.length+'</span><h2>'+s.t+'</h2><p>'+s.x+'</p><div class="vis">'+s.v+'</div>';
 document.getElementById("pg").style.width=((i+1)/S.length*100)+"%";
 clearTimeout(tm);
 if(voice&&window.speechSynthesis){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s.n);u.lang="pt-BR";u.rate=0.95;u.onend=function(){if(play)tm=setTimeout(nxt,1500)};speechSynthesis.speak(u);return}catch(e){}}
 if(play)tm=setTimeout(nxt,11000);
}
function nxt(){if(i<S.length-1){i++;show()}else{play=false;upd()}}
function prv(){if(i>0){i--;show()}}
function upd(){document.getElementById("pl").textContent=play?"⏸ Pausar":"▶ Continuar"}
document.getElementById("nx").onclick=nxt;
document.getElementById("pv").onclick=prv;
document.getElementById("pl").onclick=function(){play=!play;upd();if(play){if(i>=S.length-1){i=0}show()}else{clearTimeout(tm);if(window.speechSynthesis)speechSynthesis.cancel()}};
document.getElementById("nr").onclick=function(){voice=!voice;this.textContent="🔊 Narração: "+(voice?"ligada":"desligada");if(!voice&&window.speechSynthesis)speechSynthesis.cancel();show()};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")nxt();if(e.key==="ArrowLeft")prv()});
show();
</script>
</body>
</html>
